<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criações — Vocabulário</title>
<style>
:root{--bg:#f5f7f5;--surface:#fff;--surface-soft:#f8fbf9;--ink:#202923;--muted:#718078;--line:#e1e8e2;--green:#16834b;--soft:#e2f5e9;--button:#eef3ef;--shadow:#1e3c280c;--red:#c03932;--red-soft:#fff0ef;--gray-word:#9aa59e}
:root[data-theme="dark"]{--bg:#111714;--surface:#19221d;--surface-soft:#202c25;--ink:#edf5ef;--muted:#a2b1a7;--line:#304137;--green:#69d394;--soft:#1e4930;--button:#26342c;--shadow:#00000035;--red:#ef8a82;--red-soft:#492422;--gray-word:#aab5ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;transition:background .25s,color .25s}header{padding:18px max(24px,calc((100% - 1160px)/2));background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:72px;height:72px;border-radius:13px;background:#fff;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff}:root[data-theme="dark"] .logo,:root[data-theme="dark"] .logo img{background:var(--surface)}h1{font-size:20px;margin:0}nav{display:flex;align-items:center;gap:10px;position:relative}.back-link,.theme-toggle,.language-menu-toggle{border:0;border-radius:10px;padding:10px 15px;font:600 13px system-ui;text-decoration:none;cursor:pointer}.back-link,.theme-toggle{background:var(--button);color:var(--ink)}.theme-toggle{padding:10px 12px}.language-menu-wrap{position:relative}.language-menu-toggle{width:34px;height:34px;padding:0;border-radius:50%;background:var(--button);color:var(--ink);font-size:17px;display:grid;place-items:center}.language-menu{display:none;position:absolute;right:0;top:calc(100% + 7px);z-index:10;gap:5px;padding:7px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 25px var(--shadow)}.language-menu.open{display:flex}.language-button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--surface);border:2px solid transparent;font-size:17px;line-height:1;display:grid;place-items:center;cursor:pointer}.language-button.active{border-color:var(--green);box-shadow:0 0 0 2px var(--soft)}main{max-width:1160px;margin:30px auto;padding:0 24px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 35px var(--shadow)}.page-header{margin-bottom:24px}.eyebrow{margin:0 0 5px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h2{font-size:24px;margin:0}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}.creation-photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.creation-photo{aspect-ratio:1;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--surface-soft)}.creation-photo img{width:100%;height:100%;object-fit:contain}.creation-editor{position:relative;margin-top:22px;min-height:190px}.creation-editor textarea,.creation-highlight{position:absolute;inset:0;width:100%;min-height:190px;padding:15px;border:1px solid var(--line);border-radius:13px;font:16px/1.65 system-ui,sans-serif;letter-spacing:0;white-space:pre-wrap;overflow:auto;word-wrap:break-word}.creation-highlight{pointer-events:none;color:var(--gray-word);background:var(--surface-soft);z-index:0}.creation-editor textarea{z-index:1;resize:vertical;background:transparent;color:transparent;caret-color:var(--ink);outline:none}.creation-editor textarea::selection{background:#83b99a55}.creation-highlight mark{background:transparent;color:inherit}.creation-highlight .target-word{color:var(--green);font-weight:750}.creation-highlight .wrong-word{color:var(--red);font-weight:750}.creation-highlight .unknown-word{color:var(--gray-word)}.creation-status{min-height:26px;margin-top:14px;font-weight:700}.creation-status.success{color:var(--green)}.creation-status.error{color:var(--red)}.empty{padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}@media(max-width:620px){header{padding:16px 18px;align-items:flex-start;flex-wrap:wrap}.brand{width:100%}.logo{width:58px;height:58px}nav{width:100%;justify-content:flex-end}main{margin:20px auto;padding:0 16px}.panel{padding:20px}.creation-photos{gap:8px}.creation-photo{border-radius:11px}.page-header{margin-bottom:18px}}
</style></head>
<body>
<header><a class="back-link" href="index.html">← <span id="backLabel">Voltar</span></a><div class="brand"><div class="logo"><img src="logo-vocabulario.png" alt="Vocabulário"></div><div><h1 id="pageTitle">Criações</h1></div></div><nav><button class="theme-toggle" id="themeToggle" type="button" aria-label="Ativar modo noturno"><span>◐</span></button><div class="language-menu-wrap"><button class="language-menu-toggle" id="languageMenuToggle" type="button" aria-label="Idioma" title="Idioma">🌐</button><div class="language-menu" id="languageMenu"><button class="language-button active" data-lang="pt" type="button" aria-label="Português">🇧🇷</button><button class="language-button" data-lang="en" type="button" aria-label="English">🇺🇸</button><button class="language-button" data-lang="es" type="button" aria-label="Español">🇪🇸</button><button class="language-button" data-lang="fr" type="button" aria-label="Français">🇫🇷</button></div></div></nav></header>
<main><section class="panel"><div class="page-header"><p class="eyebrow" id="eyebrow">Prática criativa</p><h2 id="heading">Criações</h2><p class="sub" id="prompt">Escreva uma frase ou texto que contenha as três palavras das fotos.</p></div><div class="creation-photos" id="creationPhotos"></div><div class="creation-editor"><div class="creation-highlight" id="creationHighlight" aria-hidden="true"></div><textarea id="creationText" spellcheck="false" aria-label="Texto da criação"></textarea></div><div class="creation-status" id="creationStatus" role="status"></div></section></main>
<script>
(()=>{const RESET_MARK='vocabulo_reset_20261107';if(!localStorage.getItem(RESET_MARK)){localStorage.clear();localStorage.setItem(RESET_MARK,'1')}const THEME_KEY='vocabulo_theme',LANG_KEY='vocabulo_language',KEY_PREFIX='vocabulo_words_',current=()=>localStorage.getItem(LANG_KEY)||'pt',bankKey=()=>KEY_PREFIX+current(),$=id=>document.getElementById(id);const L={pt:{code:'pt-BR',title:'Criações',back:'Voltar',eyebrow:'Prática criativa',heading:'Criações',prompt:'Escreva uma frase ou texto que contenha as três palavras das fotos.',placeholder:'Escreva aqui usando as três palavras...',success:'Muito bem! Nova criação carregando...',missing:'Ainda faltam palavras verdes.',wrong:'Remova as palavras vermelhas para acertar.',empty:'Cadastre pelo menos uma palavra com foto na página principal para começar.',dark:'Ativar modo noturno',light:'Ativar modo claro'},en:{code:'en-US',title:'Creations',back:'Back',eyebrow:'Creative practice',heading:'Creations',prompt:'Write a sentence or text containing the three words from the photos.',placeholder:'Write here using the three words...',success:'Great! Loading a new creation...',missing:'Some green words are still missing.',wrong:'Remove the red words to get it right.',empty:'Add at least one word with a photo on the main page to begin.',dark:'Enable dark mode',light:'Enable light mode'},es:{code:'es-ES',title:'Creaciones',back:'Volver',eyebrow:'Práctica creativa',heading:'Creaciones',prompt:'Escribe una frase o texto que contenga las tres palabras de las fotos.',placeholder:'Escribe aquí usando las tres palabras...',success:'¡Muy bien! Cargando una nueva creación...',missing:'Todavía faltan palabras verdes.',wrong:'Elimina las palabras rojas para acertar.',empty:'Añade al menos una palabra con foto en la página principal para comenzar.',dark:'Activar modo oscuro',light:'Activar modo claro'},fr:{code:'fr-FR',title:'Créations',back:'Retour',eyebrow:'Pratique créative',heading:'Créations',prompt:'Écrivez une phrase ou un texte contenant les trois mots des photos.',placeholder:'Écrivez ici avec les trois mots...',success:'Très bien ! Nouvelle création en cours...',missing:'Il manque encore des mots verts.',wrong:'Supprimez les mots rouges pour réussir.',empty:'Ajoutez au moins un mot avec une photo sur la page principale pour commencer.',dark:'Activer le mode sombre',light:'Activer le mode clair'}};let targets=[],roundTimer=0,won=false;const lang=()=>L[current()]||L.pt;const normalize=value=>String(value||'').toLocaleLowerCase(lang().code).normalize('NFD').replace(/[\u0300-\u036f]/g,'');const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const splitWords=text=>{const re=/[\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*/gu;return [...String(text||'').matchAll(re)].map(m=>({value:m[0],index:m.index,end:m.index+m[0].length}))};const loadWords=()=>{try{let raw=localStorage.getItem(bankKey());if(!raw&&current()==='pt'&&localStorage.getItem('meuBancoDePalavras_v1'))raw=localStorage.getItem('meuBancoDePalavras_v1');const data=JSON.parse(raw||'[]');return Array.isArray(data)?data.filter(w=>w&&typeof w.word==='string'&&(w.photo||w.image)):[]}catch{return[]}};const shuffle=items=>items.slice().sort(()=>Math.random()-.5);const updateTheme=()=>{const dark=document.documentElement.dataset.theme==='dark';$('themeToggle').setAttribute('aria-label',dark?lang().light:lang().dark);$('themeToggle').title=dark?lang().light:lang().dark;$('themeToggle').firstElementChild.textContent=dark?'☼':'◐'};function renderPhotos(){const box=$('creationPhotos');box.innerHTML='';if(!targets.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=lang().empty;empty.style.gridColumn='1/-1';box.append(empty);return}targets.forEach(item=>{const card=document.createElement('div');card.className='creation-photo';const img=document.createElement('img');img.src=item.photo||item.image;img.alt='';card.append(img);box.append(card)})}function renderHighlight(){const text=$('creationText').value;const tokens=splitWords(text);const targetSet=new Set(targets.map(item=>normalize(item.word)));const bankSet=new Set(loadWords().map(item=>normalize(item.word)));let out='',last=0,hasWrong=false;for(const token of tokens){out+=escapeHtml(text.slice(last,token.index));const key=normalize(token.value);const kind=targetSet.has(key)?'target-word':bankSet.has(key)?'wrong-word':'unknown-word';if(kind==='wrong-word')hasWrong=true;out+='<mark class="'+kind+'">'+escapeHtml(token.value)+'</mark>';last=token.end}out+=escapeHtml(text.slice(last));$('creationHighlight').innerHTML=out+(text.endsWith('\n')?' ':'');return {hasWrong,used:new Set(tokens.map(token=>normalize(token.value)))} }function checkAnswer(){if(won)return;const result=renderHighlight();const status=$('creationStatus');const allUsed=targets.every(item=>result.used.has(normalize(item.word)));if(result.hasWrong){status.textContent=lang().wrong;status.className='creation-status error'}else if(!allUsed){status.textContent=lang().missing;status.className='creation-status'}else{won=true;status.textContent=lang().success;status.className='creation-status success';clearTimeout(roundTimer);roundTimer=setTimeout(generate,3000)}}function generate(){clearTimeout(roundTimer);won=false;const all=loadWords();$('creationText').value='';$('creationStatus').textContent='';$('creationStatus').className='creation-status';if(!all.length){targets=[];renderPhotos();renderHighlight();return}const distinct=shuffle(all).filter((item,index,list)=>{const photo=item.photo||item.image;return list.findIndex(other=>(other.photo||other.image)===photo)===index});targets=distinct.slice(0,3);renderPhotos();renderHighlight()}const apply=()=>{const l=lang();document.documentElement.lang=l.code;document.title=l.title+' — Vocabulário';$('pageTitle').textContent=l.title;$('backLabel').textContent=l.back;$('eyebrow').textContent=l.eyebrow;$('heading').textContent=l.heading;$('prompt').textContent=l.prompt;$('creationText').placeholder=l.placeholder;document.querySelectorAll('.language-button').forEach(b=>b.classList.toggle('active',b.dataset.lang===current()));updateTheme();generate()};document.querySelectorAll('.language-button').forEach(b=>b.onclick=()=>{localStorage.setItem(LANG_KEY,b.dataset.lang);$('languageMenu').classList.remove('open');apply()});$('languageMenuToggle').onclick=e=>{e.stopPropagation();$('languageMenu').classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.language-menu-wrap'))$('languageMenu').classList.remove('open')});$('creationText').oninput=checkAnswer;$('creationText').onscroll=()=>{$('creationHighlight').scrollTop=$('creationText').scrollTop;$('creationHighlight').scrollLeft=$('creationText').scrollLeft};const saved=localStorage.getItem(THEME_KEY);if(saved==='dark'||(!saved&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';$('themeToggle').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem(THEME_KEY,dark?'light':'dark');updateTheme()};apply()})()
</script></body></html>
