<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinônimos — Vocabulário</title>
<style>
:root{--bg:#f5f7f5;--surface:#fff;--surface-soft:#f8fbf9;--ink:#202923;--muted:#718078;--line:#e1e8e2;--green:#16834b;--soft:#e2f5e9;--button:#eef3ef;--shadow:#1e3c280c}
:root[data-theme="dark"]{--bg:#111714;--surface:#19221d;--surface-soft:#202c25;--ink:#edf5ef;--muted:#a2b1a7;--line:#304137;--green:#69d394;--soft:#1e4930;--button:#26342c;--shadow:#00000035}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;transition:background .25s,color .25s}header{padding:18px max(24px,calc((100% - 1160px)/2));background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:72px;height:72px;border-radius:13px;background:#fff;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff}:root[data-theme="dark"] .logo,:root[data-theme="dark"] .logo img{background:var(--surface)}h1{font-size:20px;margin:0}nav{display:flex;align-items:center;gap:10px;position:relative}.back-link,.theme-toggle,.language-menu-toggle{border:0;border-radius:10px;padding:10px 15px;font:600 13px system-ui;text-decoration:none;cursor:pointer}.back-link,.theme-toggle{background:var(--button);color:var(--ink)}.theme-toggle{padding:10px 12px}.language-menu-wrap{position:relative}.language-menu-toggle{width:34px;height:34px;padding:0;border-radius:50%;background:var(--button);color:var(--ink);font-size:17px;display:grid;place-items:center}.language-menu{display:none;position:absolute;right:0;top:calc(100% + 7px);z-index:10;gap:5px;padding:7px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 25px var(--shadow)}.language-menu.open{display:flex}.language-button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--surface);border:2px solid transparent;font-size:17px;line-height:1;display:grid;place-items:center;cursor:pointer}.language-button.active{border-color:var(--green);box-shadow:0 0 0 2px var(--soft)}main{max-width:1160px;margin:30px auto;padding:0 24px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 35px var(--shadow)}.exercise-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{margin:0 0 5px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h2{font-size:24px;margin:0}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}.word-card{display:grid;place-items:center;min-height:240px;padding:32px;border:1px solid var(--line);border-radius:18px;background:var(--surface-soft);text-align:center}.word-card-label{margin:0 0 6px;color:var(--muted);font-size:13px}.word{font-size:clamp(36px,7vw,76px);font-weight:800;letter-spacing:-.04em;color:var(--green);overflow-wrap:anywhere}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.option{min-height:72px;padding:16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--ink);font:600 14px/1.45 system-ui;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}.option:hover:not(:disabled){border-color:var(--green);background:var(--surface-soft);transform:translateY(-1px)}.option:disabled{cursor:default}.option.correct{border-color:#3eaa6a;background:#d9f4e2;color:#165d35}.option.incorrect{border-color:#c75d58;background:#fff0ef;color:#8d2d28}.feedback{min-height:24px;margin-top:16px;font-weight:700}.feedback.correct{color:var(--green)}.feedback.incorrect{color:#c03932}.empty{padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}@media(max-width:600px){header{padding:16px 18px;align-items:flex-start;flex-wrap:wrap}.brand{width:100%}.logo{width:58px;height:58px}nav{width:100%;justify-content:flex-end}main{margin:20px auto;padding:0 16px}.panel{padding:20px}.exercise-header{flex-direction:column}.options{grid-template-columns:1fr}}
</style></head><body>
<header><a class="back-link" href="index.html">← <span id="backLabel">Voltar</span></a><div class="brand"><div class="logo"><img src="logo-vocabulario.png" alt="Vocabulário"></div><div><h1 id="pageTitle">Sinonimos</h1></div></div><nav><button class="theme-toggle" id="themeToggle" type="button" aria-label="Ativar modo noturno"><span>◐</span></button><div class="language-menu-wrap"><button class="language-menu-toggle" id="languageMenuToggle" type="button" aria-label="Idioma" title="Idioma">🌐</button><div class="language-menu" id="languageMenu"><button class="language-button active" data-lang="pt" type="button" aria-label="Português">🇧🇷</button><button class="language-button" data-lang="en" type="button" aria-label="English">🇺🇸</button><button class="language-button" data-lang="es" type="button" aria-label="Español">🇪🇸</button><button class="language-button" data-lang="fr" type="button" aria-label="Français">🇫🇷</button></div></div></nav></header>
<main><section class="panel"><div class="exercise-header"><div><p class="eyebrow" id="eyebrow">Prática</p><h2 id="heading">Sinônimos e antônimos</h2><p class="sub" id="prompt">Marque um sinônimo e um antônimo para a palavra apresentada.</p></div></div><div class="word-card"><p class="word-card-label" id="cardLabel">Palavra</p><div class="word" id="word">—</div></div><div class="options" id="options"></div><div class="feedback" id="feedback" role="status"></div></section></main>
<script>
(()=>{const RESET_MARK='vocabulo_reset_20261107';if(!localStorage.getItem(RESET_MARK)){localStorage.clear();localStorage.setItem(RESET_MARK,'1')}const THEME_KEY='vocabulo_theme',LANG_KEY='vocabulo_language',KEY_PREFIX='vocabulo_words_',current=()=>localStorage.getItem(LANG_KEY)||'pt',bankKey=()=>KEY_PREFIX+current(),$=id=>document.getElementById(id);const L={pt:{code:'pt-BR',title:'Sinonimos',back:'Voltar',eyebrow:'Prática',heading:'Sinônimos e antônimos',prompt:'Marque um sinônimo e um antônimo para a palavra apresentada.',card:'Palavra',correct:'Correto!',wrong:'Essa opção não corresponde. Tente novamente.',empty:'Cadastre palavras com sinônimo e antônimo na página principal para começar.',dark:'Ativar modo noturno',light:'Ativar modo claro'},en:{code:'en-US',title:'Synonyms',back:'Back',eyebrow:'Practice',heading:'Synonyms and antonyms',prompt:'Mark one synonym and one antonym for the displayed word.',card:'Word',correct:'Correct!',wrong:'This option does not match. Try again.',empty:'Add words with a synonym and antonym on the main page to begin.',dark:'Enable dark mode',light:'Enable light mode'},es:{code:'es-ES',title:'Sinónimos',back:'Volver',eyebrow:'Práctica',heading:'Sinónimos y antónimos',prompt:'Marca un sinónimo y un antónimo de la palabra mostrada.',card:'Palabra',correct:'¡Correcto!',wrong:'Esta opción no corresponde. Inténtalo de nuevo.',empty:'Añade palabras con sinónimo y antónimo en la página principal para comenzar.',dark:'Activar modo oscuro',light:'Activar modo claro'},fr:{code:'fr-FR',title:'Synonymes',back:'Retour',eyebrow:'Pratique',heading:'Synonymes et antonymes',prompt:'Marquez un synonyme et un antonyme du mot affiché.',card:'Mot',correct:'Correct !',wrong:'Cette option ne correspond pas. Réessayez.',empty:'Ajoutez des mots avec un synonyme et un antonyme sur la page principale pour commencer.',dark:'Activer le mode sombre',light:'Activer le mode clair'}};let target=null,lastWord='',timer=0;const lang=()=>L[current()]||L.pt;const split=v=>String(v||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);const shuffle=a=>a.slice().sort(()=>Math.random()-.5);const loadWords=()=>{try{let raw=localStorage.getItem(bankKey());if(!raw&&current()==='pt'&&localStorage.getItem('meuBancoDePalavras_v1'))raw=localStorage.getItem('meuBancoDePalavras_v1');const data=JSON.parse(raw||'[]');return Array.isArray(data)?data.filter(w=>w&&typeof w.word==='string'):[]}catch{return[]}};const updateTheme=()=>{const dark=document.documentElement.dataset.theme==='dark';$('themeToggle').setAttribute('aria-label',dark?lang().light:lang().dark);$('themeToggle').title=dark?lang().light:lang().dark;$('themeToggle').firstElementChild.textContent=dark?'☼':'◐'};function generate(){clearTimeout(timer);const all=loadWords(),eligible=all.filter(w=>split(w.synonym).length&&split(w.antonym).length),options=$('options'),feedback=$('feedback');options.innerHTML='';feedback.textContent='';feedback.className='feedback';if(!eligible.length){target=null;$('word').textContent='—';const e=document.createElement('div');e.className='empty';e.textContent=lang().empty;options.append(e);return}const pool=eligible.length>1?eligible.filter(w=>w.word!==lastWord):eligible;target=pool[Math.floor(Math.random()*pool.length)];lastWord=target.word;$('word').textContent=target.word;const correctSyn=split(target.synonym)[0],correctAnt=split(target.antonym)[0];const otherSyn=all.flatMap(w=>split(w.synonym).map(value=>({value,type:'synonym',word:w.word}))).filter(x=>x.word!==target.word&&x.value!==correctSyn);const otherAnt=all.flatMap(w=>split(w.antonym).map(value=>({value,type:'antonym',word:w.word}))).filter(x=>x.word!==target.word&&x.value!==correctAnt);const syn=[{value:correctSyn,type:'synonym',correct:true},...shuffle(otherSyn).filter((x,i,a)=>a.findIndex(y=>y.value.toLocaleLowerCase()===x.value.toLocaleLowerCase())===i).slice(0,3)];const ant=[{value:correctAnt,type:'antonym',correct:true},...shuffle(otherAnt).filter((x,i,a)=>a.findIndex(y=>y.value.toLocaleLowerCase()===x.value.toLocaleLowerCase())===i).slice(0,3)];let solved={synonym:false,antonym:false};shuffle([...syn,...ant]).forEach(item=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=item.value;b.onclick=()=>{if(item.correct){solved[item.type]=true;b.classList.add('correct');b.disabled=true;feedback.textContent=solved.synonym&&solved.antonym?lang().correct:lang().correct;feedback.className='feedback correct';if(solved.synonym&&solved.antonym)timer=setTimeout(generate,850)}else{b.classList.add('incorrect');feedback.textContent=lang().wrong;feedback.className='feedback incorrect';setTimeout(()=>b.classList.remove('incorrect'),650)}};options.append(b)})}const apply=()=>{const l=lang();document.documentElement.lang=l.code;document.title=l.title+' — Vocabulário';$('pageTitle').textContent=l.title;$('backLabel').textContent=l.back;$('eyebrow').textContent=l.eyebrow;$('heading').textContent=l.heading;$('prompt').textContent=l.prompt;$('cardLabel').textContent=l.card;document.querySelectorAll('.language-button').forEach(b=>b.classList.toggle('active',b.dataset.lang===current()));updateTheme();generate()};document.querySelectorAll('.language-button').forEach(b=>b.onclick=()=>{localStorage.setItem(LANG_KEY,b.dataset.lang);$('languageMenu').classList.remove('open');apply()});$('languageMenuToggle').onclick=e=>{e.stopPropagation();$('languageMenu').classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.language-menu-wrap'))$('languageMenu').classList.remove('open')});const saved=localStorage.getItem(THEME_KEY);if(saved==='dark'||(!saved&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';$('themeToggle').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem(THEME_KEY,dark?'light':'dark');updateTheme()};apply()})()
</script></body></html>
