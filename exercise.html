<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exercício — Vocabulário</title>
<style>
:root{--bg:#f5f7f5;--surface:#fff;--surface-soft:#f8fbf9;--ink:#202923;--muted:#718078;--line:#e1e8e2;--green:#16834b;--soft:#e2f5e9;--button:#eef3ef;--shadow:#1e3c280c}
:root[data-theme="dark"]{--bg:#111714;--surface:#19221d;--surface-soft:#202c25;--ink:#edf5ef;--muted:#a2b1a7;--line:#304137;--green:#69d394;--soft:#1e4930;--button:#26342c;--shadow:#00000035}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;transition:background .25s,color .25s}header{padding:18px max(24px,calc((100% - 1160px)/2));background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:46px;height:46px;border-radius:13px;background:var(--soft);display:grid;place-items:center;color:var(--green);font-size:22px;font-weight:800;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit}h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:13px}nav{display:flex;align-items:center;gap:10px;position:relative}.back-link,.theme-toggle,.language-menu-toggle,.primary,.secondary{border:0;border-radius:10px;padding:10px 15px;font:600 13px system-ui;text-decoration:none;cursor:pointer}.back-link,.secondary,.theme-toggle{background:var(--button);color:var(--ink)}.theme-toggle{padding:10px 12px}.language-menu-wrap{position:relative}.language-menu-toggle{width:34px;height:34px;padding:0;border-radius:50%;background:var(--button);color:var(--ink);font-size:17px;display:grid;place-items:center}.language-menu{display:none;position:absolute;right:0;top:calc(100% + 7px);z-index:10;gap:5px;padding:7px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 25px var(--shadow)}.language-menu.open{display:flex}.language-button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--surface);border:2px solid transparent;font-size:17px;line-height:1;display:grid;place-items:center;cursor:pointer}.language-button.active{border-color:var(--green);box-shadow:0 0 0 2px var(--soft)}main{max-width:1160px;margin:30px auto;padding:0 24px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 35px var(--shadow)}.exercise-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{margin:0 0 5px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h2{font-size:24px;margin:0}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}.exercise-card{display:grid;place-items:center;min-height:280px;padding:32px;border:1px solid var(--line);border-radius:18px;background:var(--surface-soft);text-align:center}.exercise-card-label{margin:0 0 6px;color:var(--muted);font-size:13px}.exercise-word{font-size:clamp(36px,7vw,76px);font-weight:800;letter-spacing:-.04em;color:var(--green);overflow-wrap:anywhere}.exercise-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.exercise-option{min-height:72px;padding:16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--ink);font:600 14px/1.45 system-ui;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}.exercise-option:hover:not(:disabled){border-color:var(--green);background:var(--surface-soft);transform:translateY(-1px)}.exercise-option:disabled{cursor:default}.exercise-option.correct{border-color:#3eaa6a;background:#d9f4e2;color:#165d35}.exercise-option.incorrect{border-color:#c75d58;background:#fff0ef;color:#8d2d28}.exercise-feedback{min-height:24px;margin-top:16px;font-weight:700}.exercise-feedback.correct{color:var(--green)}.exercise-feedback.incorrect{color:#c03932}.exercise-empty{padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}@media(max-width:600px){header{padding:16px 18px;align-items:flex-start;flex-wrap:wrap}nav{width:100%;justify-content:flex-end}.brand{width:100%}main{margin:20px auto;padding:0 16px}.panel{padding:20px}.exercise-header{flex-direction:column}.exercise-header button{width:100%}.exercise-options{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a class="back-link" id="backLink" href="index.html">← <span id="backLabel">Voltar</span></a><div class="brand"><div class="logo"><img src="logo-vocabulario.webp" alt="Vocabulário"></div><div><h1 id="pageTitle">Exercício</h1><p id="pageSubtitle">Pratique seus significados</p></div></div><nav><button class="theme-toggle" id="themeToggle" type="button" aria-label="Ativar modo noturno"><span class="theme-icon">◐</span></button><div class="language-menu-wrap"><button class="language-menu-toggle" id="languageMenuToggle" type="button" aria-label="Idioma" title="Idioma">🌐</button><div class="language-menu" id="languageMenu"><button class="language-button active" type="button" data-lang="pt" aria-label="Português">🇧🇷</button><button class="language-button" type="button" data-lang="en" aria-label="English">🇺🇸</button><button class="language-button" type="button" data-lang="es" aria-label="Español">🇪🇸</button><button class="language-button" type="button" data-lang="fr" aria-label="Français">🇫🇷</button></div></div></nav></header>
<main><section class="panel"><div class="exercise-header"><div><p class="eyebrow" id="exerciseEyebrow">Prática</p><h2 id="exerciseTitle">Exercício de significado</h2><p class="sub" id="exercisePrompt">Escolha o significado correto para a palavra apresentada.</p></div><button class="secondary" id="newExercise" type="button">↻ <span id="newExerciseLabel">Novo exercício</span></button></div><div class="exercise-card"><div class="exercise-word" id="exerciseWord">—</div></div><div class="exercise-options" id="exerciseOptions"></div><div class="exercise-feedback" id="exerciseFeedback" role="status"></div></section></main>
<script>
(()=>{const RESET_MARK='vocabulo_reset_20261107';if(!localStorage.getItem(RESET_MARK)){localStorage.clear();localStorage.setItem(RESET_MARK,'1')}const THEME_KEY='vocabulo_theme',LANG_KEY='vocabulo_language',KEY_PREFIX='vocabulo_words_',current=()=>localStorage.getItem(LANG_KEY)||'pt',bankKey=()=>KEY_PREFIX+current(),$=id=>document.getElementById(id);const L={pt:{code:'pt-BR',title:'Exercício',subtitle:'Pratique seus significados',back:'Voltar',eyebrow:'Prática',heading:'Exercício de significado',prompt:'Escolha o significado correto para a palavra apresentada.',new:'Novo exercício',correct:'Correto!',incorrect:'Não foi dessa vez. Tente novamente.',empty:'Cadastre palavras com significado na página principal para começar.',dark:'Ativar modo noturno',light:'Ativar modo claro'},en:{code:'en-US',title:'Exercise',subtitle:'Practice your meanings',back:'Back',eyebrow:'Practice',heading:'Meaning exercise',prompt:'Choose the correct meaning for the displayed word.',new:'New exercise',correct:'Correct!',incorrect:'Not this time. Try again.',empty:'Add words with a meaning on the main page to begin.',dark:'Enable dark mode',light:'Enable light mode'},es:{code:'es-ES',title:'Ejercicio',subtitle:'Practica tus significados',back:'Volver',eyebrow:'Práctica',heading:'Ejercicio de significado',prompt:'Elige el significado correcto de la palabra mostrada.',new:'Nuevo ejercicio',correct:'¡Correcto!',incorrect:'No esta vez. Inténtalo de nuevo.',empty:'Añade palabras con significado en la página principal para comenzar.',dark:'Activar modo oscuro',light:'Activar modo claro'},fr:{code:'fr-FR',title:'Exercice',subtitle:'Pratiquez vos définitions',back:'Retour',eyebrow:'Pratique',heading:'Exercice de définition',prompt:'Choisissez la bonne définition du mot affiché.',new:'Nouvel exercice',correct:'Correct !',incorrect:'Pas cette fois. Réessayez.',empty:'Ajoutez des mots avec une définition sur la page principale pour commencer.',dark:'Activer le mode sombre',light:'Activer le mode clair'}};let word=null;const lang=()=>L[current()]||L.pt;const loadWords=()=>{try{let raw=localStorage.getItem(bankKey());if(!raw&&current()==='pt'&&localStorage.getItem('meuBancoDePalavras_v1')){raw=localStorage.getItem('meuBancoDePalavras_v1');localStorage.setItem(bankKey(),raw)}const d=JSON.parse(raw||'[]');return Array.isArray(d)?d.filter(w=>w&&typeof w.word==='string'&&w.meaning&&w.meaning.trim()):[]}catch{return[]}};const shuffle=a=>a.slice().sort(()=>Math.random()-.5);const updateTheme=()=>{const dark=document.documentElement.dataset.theme==='dark';$('themeToggle').setAttribute('aria-label',dark?lang().light:lang().dark);$('themeToggle').title=dark?lang().light:lang().dark;$('themeToggle').querySelector('.theme-icon').textContent=dark?'☼':'◐'};function generate(){const words=loadWords(), options=$('exerciseOptions'),feedback=$('exerciseFeedback');options.innerHTML='';feedback.textContent='';feedback.className='exercise-feedback';if(!words.length){word=null;$('exerciseWord').textContent='—';const empty=document.createElement('div');empty.className='exercise-empty';empty.textContent=lang().empty;options.append(empty);return}word=words[Math.floor(Math.random()*words.length)];$('exerciseWord').textContent=word.word;const answer=word.meaning.trim();const distractors=shuffle(words.filter(w=>w.id!==word.id&&w.meaning.trim()!==answer)).map(w=>w.meaning.trim()).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);shuffle([answer,...distractors]).forEach(value=>{const button=document.createElement('button');button.type='button';button.className='exercise-option';button.textContent=value;button.onclick=()=>{const correct=value===answer;document.querySelectorAll('.exercise-option').forEach(item=>{item.disabled=true;if(item.textContent===answer)item.classList.add('correct')});if(!correct)button.classList.add('incorrect');feedback.textContent=correct?lang().correct:lang().incorrect;feedback.className='exercise-feedback '+(correct?'correct':'incorrect')};options.append(button)})}const apply=()=>{const l=lang();document.documentElement.lang=l.code;document.title=l.title+' — Vocabulário';$('pageTitle').textContent=l.title;$('pageSubtitle').textContent=l.subtitle;$('backLabel').textContent=l.back;$('exerciseEyebrow').textContent=l.eyebrow;$('exerciseTitle').textContent=l.heading;$('exercisePrompt').textContent=l.prompt;$('newExerciseLabel').textContent=l.new;document.querySelectorAll('.language-button').forEach(b=>b.classList.toggle('active',b.dataset.lang===current()));updateTheme();generate()};document.querySelectorAll('.language-button').forEach(button=>button.onclick=()=>{localStorage.setItem(LANG_KEY,button.dataset.lang);$('languageMenu').classList.remove('open');apply()});$('languageMenuToggle').onclick=e=>{e.stopPropagation();$('languageMenu').classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.language-menu-wrap'))$('languageMenu').classList.remove('open')});const saved=localStorage.getItem(THEME_KEY);if(saved==='dark'||(!saved&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';$('themeToggle').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem(THEME_KEY,dark?'light':'dark');updateTheme()};$('newExercise').onclick=generate;apply()})()
</script>
</body>
</html>
