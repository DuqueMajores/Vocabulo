<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulário — Banco de Palavras</title>
<style>
:root{--bg:#f5f7f5;--surface:#fff;--surface-soft:#f8fbf9;--ink:#202923;--muted:#718078;--line:#e1e8e2;--green:#16834b;--soft:#e2f5e9;--button:#eef3ef;--shadow:#1e3c280c}
:root[data-theme="dark"]{--bg:#111714;--surface:#19221d;--surface-soft:#202c25;--ink:#edf5ef;--muted:#a2b1a7;--line:#304137;--green:#69d394;--soft:#1e4930;--button:#26342c;--shadow:#00000035}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;transition:background .25s,color .25s}header{padding:18px max(24px,calc((100% - 1160px)/2));background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;color:var(--green);font-size:22px;font-weight:800}h1{font-size:20px;margin:0}header p,.sub{margin:4px 0 0;color:var(--muted);font-size:13px}nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.theme-toggle,.refresh-button{display:inline-flex;align-items:center;gap:7px}.theme-icon{font-size:15px}.nav-add{white-space:nowrap}.nav-add.active{background:#d9f4e2;color:#08753b}.theme-toggle{background:var(--button);color:var(--ink)}main{max-width:1160px;margin:30px auto;padding:0 24px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.8fr);gap:20px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 12px 35px var(--shadow)}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}h2{font-size:16px;margin:0}button{border:0;border-radius:10px;padding:10px 15px;font:600 13px system-ui;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:var(--button);color:var(--ink)}.danger{background:#fff0ef;color:#b53a32;padding:7px 10px}.add-row{display:flex;gap:8px;margin-bottom:18px}.add-row input,.search,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:14px system-ui;outline:none;color:var(--ink);background:var(--surface)}.notes-section{border:0}.notes-section>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin:-2px 0 18px;padding:0;font-size:16px;font-weight:700}.notes-section>summary::-webkit-details-marker{display:none}.notes-section>summary::after{content:'⌄';color:var(--muted);font-size:18px;transition:transform .2s}.notes-section:not([open])>summary::after{transform:rotate(-90deg)}.notes-section>summary p{font-size:13px;font-weight:400;color:var(--muted);margin:4px 0 0}.add-row input{flex:1;min-width:0}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field textarea{min-height:78px;resize:vertical}.field #exampleInput{min-height:115px}::placeholder{color:#b8c3bc;opacity:1}.editor-wrap #writingArea::placeholder{color:#d9dfdc;opacity:1}textarea:focus,input:focus{border-color:#79bd91;box-shadow:0 0 0 3px #16834b17}.note{font-size:12px;color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:10px;margin:14px 0 22px;flex-wrap:wrap}.editor-wrap{position:relative;min-height:240px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface)}#highlightLayer,#writingArea{font:15px/1.75 ui-monospace,Consolas,monospace;padding:16px;width:100%;min-height:240px;white-space:pre-wrap;overflow-wrap:break-word;margin:0;border:0}#highlightLayer{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden}#writingArea{position:relative;resize:vertical;background:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--ink);outline:none}#writingArea::selection{background:#16834b38}mark{border-radius:3px;font-weight:700}.bank-word{background:#d9f4e2;color:#08753b}.misspelled-word{background:#ffe0e0;color:#c62828;text-decoration:underline wavy #e05252 1px}.unknown-word{background:var(--button);color:#aeb8b1}.editor-foot{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:12px}.editor-title-actions{display:flex;align-items:center;gap:8px}.speak-button{padding:8px 11px;min-width:42px;background:var(--soft);color:var(--green);font-size:16px;line-height:1}.stop-button{padding:8px 11px;background:var(--button);color:#66736b;font-size:15px;line-height:1}.speak-button:disabled,.stop-button:disabled{opacity:.45;cursor:not-allowed}.search{margin-bottom:12px}.word-list{display:flex;flex-direction:column;gap:8px;max-height:620px;overflow:auto}.word-item{border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;align-items:center;gap:8px}.word-item.selected{border-color:#68b886;background:var(--surface-soft);box-shadow:inset 3px 0 var(--green)}.word-select{background:transparent;text-align:left;padding:0;flex:1;min-width:0}.word-name{font-weight:750;color:var(--green);overflow-wrap:anywhere}.word-meta{font-size:12px;color:var(--muted);margin-top:3px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:25px 10px;border:1px dashed var(--line);border-radius:12px}.count{font-size:12px;color:var(--muted);background:var(--button);padding:5px 9px;border-radius:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20362a;color:white;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:820px){main{grid-template-columns:1fr;margin:20px auto;padding:0 16px}header{padding:18px 20px;flex-wrap:wrap}.brand{min-width:0}nav{order:3;width:100%;justify-content:stretch}.nav-add{flex:1}.theme-toggle{flex:0 0 auto}.count{white-space:nowrap}.word-list{max-height:300px}}
</style></head><body>
<header><div class="brand"><div class="logo">Aa</div><div><h1>Vocabulário</h1><p>Seu banco pessoal de palavras</p></div></div><nav aria-label="Navegação principal"><button class="secondary nav-add" id="toggleAdd" type="button">＋ Adicionar palavra</button><button class="theme-toggle" id="themeToggle" type="button" aria-label="Ativar modo noturno"><span class="theme-icon" aria-hidden="true">◐</span><span id="themeLabel">Modo noturno</span></button><span class="count" id="totalCount">0 palavras</span></nav></header>
<main><section class="panel"><details class="notes-section" open><summary><div>Palavra e anotações<p id="selectionStatus">Adicione uma palavra ou selecione uma já cadastrada.</p></div></summary>
<div class="field"><label for="meaningInput">O que significa?</label><textarea id="meaningInput" placeholder="Escreva o significado da palavra..."></textarea></div>
<div class="field"><label for="originInput">Qual é a origem da palavra?</label><textarea id="originInput" placeholder="Registre a origem ou etimologia..."></textarea></div>
<div class="field"><label for="exampleInput">Texto com a palavra</label><textarea id="exampleInput" placeholder="Escreva uma frase ou texto utilizando a palavra..."></textarea></div>
<div class="actions"><button class="secondary" id="clearFields" type="button">Limpar campos</button><button class="primary" id="saveNotes" type="button" disabled>Salvar anotações</button></div>
</details><div style="height:1px;background:var(--line);margin:20px 0"></div><div class="head"><div><h2>Quadro Aprender</h2></div><div class="editor-title-actions"><button class="speak-button" id="speakToggle" type="button" aria-label="Ler texto em voz alta" title="Ler texto em voz alta">▶</button><button class="stop-button" id="speakStop" type="button" aria-label="Parar leitura" title="Parar leitura" disabled>■</button></div></div>
<div class="editor-wrap"><div id="highlightLayer" aria-hidden="true"></div><textarea id="writingArea" spellcheck="false" placeholder=""></textarea></div><div class="editor-foot"><span id="matchCount">0 ocorrências</span></div></section>
<aside class="panel"><div class="head"><div><h2>Banco de palavras</h2><p class="sub">Cinco sugestões aleatórias</p></div><div class="editor-title-actions"><button class="secondary refresh-button" id="refreshWords" type="button" aria-label="Sortear cinco palavras" title="Sortear cinco palavras">↻ <span>Atualizar</span></button><span class="count" id="wordCount">0</span></div></div><input class="search" id="searchWords" type="search" placeholder="Pesquisar palavra..."><div class="word-list" id="wordList"></div></aside></main><div class="toast" id="toast" role="status"></div>
<script>
(()=>{const KEY='meuBancoDePalavras_v1', THEME_KEY='vocabulo_theme', $=id=>document.getElementById(id), editor=$('writingArea'),layer=$('highlightLayer'),list=$('wordList');let words=[];let selectedId=null;let displayedWords=[];try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');words=Array.isArray(d)?d.filter(w=>w&&typeof w.word==='string'):[]}catch{}
const persist=()=>localStorage.setItem(KEY,JSON.stringify(words));const randomizeWords=()=>{displayedWords=[];const pool=words.slice();if(!pool.length)return;for(let i=0;i<5;i++)displayedWords.push(pool[Math.floor(Math.random()*pool.length)])};const updateThemeButton=()=>{const dark=document.documentElement.dataset.theme==='dark';$('themeLabel').textContent=dark?'Modo claro':'Modo noturno';$('themeToggle').setAttribute('aria-label',dark?'Ativar modo claro':'Ativar modo noturno');$('themeToggle').querySelector('.theme-icon').textContent=dark?'☼':'◐'};const savedTheme=localStorage.getItem(THEME_KEY);if(savedTheme==='dark'||(!savedTheme&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';updateThemeButton();$('themeToggle').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem(THEME_KEY,dark?'light':'dark');updateThemeButton()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const selected=()=>words.find(w=>w.id===selectedId);function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
function clearFields(){ $('meaningInput').value='';$('originInput').value='';$('exampleInput').value='';selectedId=null;$('selectionStatus').textContent='Nenhuma palavra selecionada. Adicione ou escolha uma palavra no banco.';$('saveNotes').disabled=true;renderList() }
function selectWord(id){const w=words.find(x=>x.id===id);if(!w)return;selectedId=id;$('meaningInput').value=w.meaning||'';$('originInput').value=w.origin||'';$('exampleInput').value=w.example||'';$('selectionStatus').textContent='Palavra selecionada: '+w.word;$('saveNotes').disabled=false;renderList()}
function renderList(){const q=$('searchWords').value.trim().toLocaleLowerCase('pt-BR'),arr=words.filter(w=>w.word.toLocaleLowerCase('pt-BR').includes(q)).sort((a,b)=>a.word.localeCompare(b.word,'pt-BR'));$('totalCount').textContent=words.length+' palavras';$('wordCount').textContent=words.length;list.innerHTML='';if(!arr.length){list.innerHTML=`<div class="empty">${words.length?'Nenhuma palavra encontrada.':'Seu banco ainda está vazio.<br>Adicione sua primeira palavra.'}</div>`;return}const visible=q?arr:displayedWords;visible.forEach(w=>{const row=document.createElement('div');row.className='word-item'+(w.id===selectedId?' selected':'');const b=document.createElement('button');b.type='button';b.className='word-select';const n=document.createElement('div');n.className='word-name';n.textContent=w.word;const m=document.createElement('div');m.className='word-meta';m.textContent=w.meaning||'Clique para visualizar ou preencher';b.append(n,m);b.onclick=()=>selectWord(w.id);const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Excluir';del.onclick=()=>{if(confirm(`Excluir "${w.word}" do banco?`)){words=words.filter(x=>x.id!==w.id);persist();if(selectedId===w.id)clearFields();randomizeWords();renderList();renderHighlight();toast('Palavra excluída.')}};row.append(b,del);list.append(row)})}
let spellingTimer=0,spellingRequest=0;function bankPattern(){return [...words].sort((a,b)=>b.word.length-a.word.length).map(w=>w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')}function paintHighlight(text,misspelled=new Set()){if(!text){layer.textContent=' ';$('matchCount').textContent='0 ocorrências';return}const bank=bankPattern(),bankRe=bank?new RegExp('(^|[^\p{L}\p{N}_])('+bank+')(?=$|[^\p{L}\p{N}_])','giu'):null,wordRe=/[\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*/gu;let out='',last=0,count=0;const spans=[];if(bankRe)for(const m of text.matchAll(bankRe)){const start=m.index+(m[1]||'').length;spans.push({start,end:start+m[2].length,type:'bank'});count++}for(const m of text.matchAll(wordRe)){const start=m.index,end=start+m[0].length;if(spans.some(x=>x.start<=start&&x.end>=end))continue;spans.push({start,end,type:misspelled.has(start)?'misspelled':'unknown'})}spans.sort((a,b)=>a.start-b.start);for(const span of spans){if(span.start<last)continue;out+=esc(text.slice(last,span.start));out+='<mark class="'+span.type+'-word">'+esc(text.slice(span.start,span.end))+'</mark>';last=span.end}out+=esc(text.slice(last));layer.innerHTML=out+(text.endsWith('\n')?' ':'');$('matchCount').textContent=count+' '+(count===1?'ocorrência':'ocorrências')}function renderHighlight(){const text=editor.value;paintHighlight(text);clearTimeout(spellingTimer);const request=++spellingRequest;if(!text)return;spellingTimer=setTimeout(async()=>{try{const body=new URLSearchParams({text,language:'auto',enabledOnly:'false'});const res=await fetch('https://api.languagetool.org/v2/check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!res.ok)throw new Error('spellcheck');const data=await res.json();if(request!==spellingRequest||text!==editor.value)return;const misspelled=new Set((data.matches||[]).filter(m=>m.rule?.issueType==='misspelling'||m.rule?.id?.startsWith('MORFOLOGIK_')).map(m=>m.offset));paintHighlight(text,misspelled)}catch{}} ,350)}
$('toggleAdd').onclick=()=>{const word=prompt('Digite a palavra que deseja cadastrar:');if(!word)return;const clean=word.trim();if(!clean)return;if(words.some(w=>w.word.toLocaleLowerCase('pt-BR')===clean.toLocaleLowerCase('pt-BR'))){toast('Essa palavra já existe no banco.');return}const id=crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());words.push({id,word:clean,meaning:'',origin:'',example:'',createdAt:new Date().toISOString()});persist();randomizeWords();selectWord(id);renderHighlight();toast('Palavra adicionada. Preencha as anotações.');};
const speakToggle=$('speakToggle'),speakStop=$('speakStop');let speaking=false;if(!('speechSynthesis' in window)){speakToggle.disabled=true;speakToggle.title='Leitura por voz indisponível neste navegador'}function resetSpeech(){speaking=false;speakToggle.textContent='▶';speakToggle.setAttribute('aria-label','Ler texto em voz alta');speakStop.disabled=true}function startSpeech(){const text=editor.value,start=Math.max(0,Math.min(editor.selectionStart||0,text.length)),content=text.slice(start).trim();if(!content){toast('Escreva um texto ou coloque o cursor antes de iniciar a leitura.');return}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(content);utterance.lang='pt-BR';utterance.rate=1;utterance.onend=resetSpeech;utterance.onerror=resetSpeech;speaking=true;speakToggle.textContent='Ⅱ';speakToggle.setAttribute('aria-label','Pausar leitura');speakStop.disabled=false;window.speechSynthesis.speak(utterance)}speakToggle.onclick=()=>{if(!('speechSynthesis' in window))return;if(!speaking){startSpeech();return}if(window.speechSynthesis.paused){window.speechSynthesis.resume();speakToggle.textContent='Ⅱ';speakToggle.setAttribute('aria-label','Pausar leitura')}else{window.speechSynthesis.pause();speakToggle.textContent='▶';speakToggle.setAttribute('aria-label','Continuar leitura')}};speakStop.onclick=()=>{if('speechSynthesis' in window)window.speechSynthesis.cancel();resetSpeech()};$('saveNotes').onclick=()=>{const w=selected();if(!w)return;w.meaning=$('meaningInput').value.trim();w.origin=$('originInput').value.trim();w.example=$('exampleInput').value.trim();persist();renderList();toast('Anotações salvas.')};$('clearFields').onclick=()=>{if(selected()){ $('meaningInput').value='';$('originInput').value='';$('exampleInput').value='';toast('Campos limpos. Clique em Salvar anotações para confirmar.')}else{ $('meaningInput').value='';$('originInput').value='';$('exampleInput').value='';toast('Campos limpos.')}};$('refreshWords').onclick=()=>{randomizeWords();renderList();toast('Cinco palavras atualizadas.')};$('searchWords').oninput=()=>{if(!$('searchWords').value.trim())randomizeWords();renderList()};window.addEventListener('pageshow',()=>{randomizeWords();renderList()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){randomizeWords();renderList()}});editor.oninput=renderHighlight;editor.onscroll=()=>{layer.scrollTop=editor.scrollTop;layer.scrollLeft=editor.scrollLeft};randomizeWords();renderList();renderHighlight()})();
</script></body></html>
