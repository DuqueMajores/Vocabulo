<!DOCTYPE html>

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;transition:background .25s,color .25s}header{padding:18px max(24px,calc((100% - 1160px)/2));background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:72px;height:72px;border-radius:13px;background:#fff;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff}:root[data-theme="dark"] .logo,:root[data-theme="dark"] .logo img{background:var(--surface)}h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:13px}nav{display:flex;align-items:center;gap:10px}.back-link,.theme-toggle,.language-menu-toggle,.secondary{border:0;border-radius:10px;padding:10px 15px;font:600 13px system-ui;text-decoration:none;cursor:pointer}.back-link,.secondary,.theme-toggle{background:var(--button);color:var(--ink)}.theme-toggle{padding:10px 12px}.language-menu-wrap{position:relative}.language-menu-toggle{width:34px;height:34px;padding:0;border-radius:50%;background:var(--button);color:var(--ink);font-size:17px;display:grid;place-items:center}.language-menu{display:none;position:absolute;right:0;top:calc(100% + 7px);z-index:10;gap:5px;padding:7px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 25px var(--shadow)}.language-menu.open{display:flex}.language-button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--surface);border:2px solid transparent;font-size:17px;line-height:1;display:grid;place-items:center;cursor:pointer}.language-button.active{border-color:var(--green);box-shadow:0 0 0 2px var(--soft)}main{max-width:760px;margin:30px auto;padding:0 24px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 35px var(--shadow)}.exercise-header{text-align:center;margin-bottom:24px}.eyebrow{margin:0 0 5px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h2{font-size:24px;margin:0}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}.flash-card{perspective:1000px;width:min(100%,500px);height:330px;margin:0 auto}.flash-card-inner{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d}.flash-card.flipped .flash-card-inner{transform:rotateY(180deg)}.flash-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}.flash-front img{width:100%;height:100%;object-fit:contain;padding:22px}.flash-back{transform:rotateY(180deg);flex-direction:column;gap:8px;padding:24px;text-align:center}.flash-answer{font-size:clamp(34px,7vw,72px);font-weight:800;letter-spacing:-.04em;color:var(--green);overflow-wrap:anywhere}.flash-input-row{display:flex;gap:10px;max-width:500px;margin:20px auto 0}.flash-input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:var(--surface);color:var(--ink);font:inherit;outline:none}.flash-input:focus{border-color:#79bd91;box-shadow:0 0 0 3px #16834b17}.flash-check{border:0;border-radius:11px;padding:0 20px;background:var(--green);color:white;font:700 14px system-ui;cursor:pointer}.flash-check:disabled{opacity:.5;cursor:not-allowed}.flash-feedback{min-height:26px;margin-top:14px;text-align:center;font-weight:700}.flash-feedback.correct{color:var(--green)}.flash-feedback.incorrect{color:#c03932}.flash-empty{padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.flash-progress{margin-top:14px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:600px){header{padding:16px 18px;align-items:flex-start;flex-wrap:wrap}.brand{width:100%}.logo{width:58px;height:58px}nav{width:100%;justify-content:flex-end}main{margin:20px auto;padding:0 16px}.panel{padding:20px}.flash-card{height:280px}.flash-input-row{flex-direction:column}.flash-check{min-height:46px}}
</style>
</head>
<body>
<header><a class="back-link" href="index.html">← <span id="backLabel">Voltar</span></a><div class="brand"><div class="logo"><img src="logo-vocabulario.png" alt="Poliglota"></div><div><h1 id="pageTitle">Flash</h1></div></div><nav><button class="theme-toggle" id="themeToggle" type="button" aria-label="Ativar modo noturno"><span class="theme-icon">◐</span></button><div class="language-menu-wrap"><button class="language-menu-toggle" id="languageMenuToggle" type="button" aria-label="Idioma" title="Idioma">🌐</button><div class="language-menu" id="languageMenu"><button class="language-button active" data-lang="pt" type="button" aria-label="Português">🇧🇷</button><button class="language-button" data-lang="en" type="button" aria-label="English">🇺🇸</button><button class="language-button" data-lang="es" type="button" aria-label="Español">🇪🇸</button><button class="language-button" data-lang="fr" type="button" aria-label="Français">🇫🇷</button><button class="language-button" type="button" data-lang="de" aria-label="Deutsch" title="Deutsch">🇩🇪</button><button class="language-button" type="button" data-lang="it" aria-label="Italiano" title="Italiano">🇮🇹</button></div></div></nav></header>
<main><section class="panel"><div class="exercise-header"><p class="eyebrow" id="eyebrow">Prática</p><h2 id="heading">Flash</h2><p class="sub" id="prompt">Digite a palavra representada pela imagem.</p></div><div id="flashArea"></div><div class="flash-input-row" id="inputRow"><input class="flash-input" id="answerInput" type="text" autocomplete="off" spellcheck="false"><button class="flash-check" id="checkButton" type="button">Conferir</button></div><div class="flash-feedback" id="feedback" role="status"></div></section></main>
<script>
(()=>{const RESET_MARK='vocabulo_reset_20261108';if(!localStorage.getItem(RESET_MARK)){localStorage.clear();localStorage.setItem(RESET_MARK,'1')}const THEME_KEY='vocabulo_theme',LANG_KEY='vocabulo_language',KEY_PREFIX='vocabulo_words_',current=()=>localStorage.getItem(LANG_KEY)||'pt',bankKey=()=>KEY_PREFIX+current(),$=id=>document.getElementById(id);const playCorrectSound=(()=>{const audio=new Audio('correct-answer.mp3');return()=>{audio.currentTime=0;const p=audio.play();if(p&&typeof p.catch==='function')p.catch(()=>{})}})();const playIncorrectSound=(()=>{const audio=new Audio('incorrect-answer.mp3');return()=>{audio.currentTime=0;const p=audio.play();if(p&&typeof p.catch==='function')p.catch(()=>{})}})();const L={pt:{code:'pt-BR',title:'Flash',back:'Voltar',eyebrow:'Prática',heading:'Flash',prompt:'Digite a palavra representada pela imagem.',input:'Digite a palavra...',check:'Conferir',correct:'Correto!',incorrect:'Não foi dessa vez. Tente novamente.',empty:'Cadastre palavras com foto na página principal para começar.',dark:'Ativar modo noturno',light:'Ativar modo claro'},en:{code:'en-US',title:'Flash',back:'Back',eyebrow:'Practice',heading:'Flash',prompt:'Type the word represented by the image.',input:'Type the word...',check:'Check',correct:'Correct!',incorrect:'Not this time. Try again.',empty:'Add words with a photo on the main page to begin.',dark:'Enable dark mode',light:'Enable light mode'},es:{code:'es-ES',title:'Flash',back:'Volver',eyebrow:'Práctica',heading:'Flash',prompt:'Escribe la palabra representada por la imagen.',input:'Escribe la palabra...',check:'Comprobar',correct:'¡Correcto!',incorrect:'No esta vez. Inténtalo de nuevo.',empty:'Añade palabras con foto en la página principal para comenzar.',dark:'Activar modo oscuro',light:'Desactivar modo claro'},fr:{code:'fr-FR',title:'Flash',back:'Retour',eyebrow:'Pratique',heading:'Flash',prompt:'Écrivez le mot représenté par l’image.',input:'Écrivez le mot...',check:'Vérifier',correct:'Correct !',incorrect:'Pas cette fois. Réessayez.',empty:'Ajoutez des mots avec une photo sur la page principale pour commencer.',dark:'Activer le mode sombre',light:'Activer le mode clair'},de:{"code":"de-DE","title":"Flash","back":"Zurück","eyebrow":"Übung","heading":"Flash","prompt":"Geben Sie das durch das Bild dargestellte Wort ein.","input":"Wort eingeben...","check":"Prüfen","correct":"Richtig!","incorrect":"Nicht diesmal. Versuchen Sie es erneut.","empty":"Fügen Sie auf der Hauptseite Wörter mit Foto hinzu, um zu beginnen.","dark":"Dunkelmodus aktivieren","light":"Hellmodus aktivieren"},it:{"code":"it-IT","title":"Flash","back":"Indietro","eyebrow":"Esercizio","heading":"Flash","prompt":"Inserisci la parola rappresentata dall’immagine.","input":"Inserisci la parola...","check":"Verifica","correct":"Corretto!","incorrect":"Non questa volta. Riprova.","empty":"Aggiungi parole con foto nella pagina principale per iniziare.","dark":"Attiva modalità scura","light":"Attiva modalità chiara"}};const lang=()=>L[current()]||L.pt;const siteName=()=>({pt:'Poliglota',en:'Polyglot',es:'Políglota',fr:'Polyglotte',de:'Polyglott',it:'Poliglota'}[current()]||'Poliglota');const normalize=value=>String(value||'').trim().toLocaleLowerCase(lang().code).normalize('NFD').replace(/[\u0300-\u036f]/g,'');const loadWords=()=>{try{let raw=localStorage.getItem(bankKey());if(!raw&&current()==='pt'&&localStorage.getItem('meuBancoDePalavras_v1'))raw=localStorage.getItem('meuBancoDePalavras_v1');const data=JSON.parse(raw||'[]');return Array.isArray(data)?data.filter(w=>w&&typeof w.word==='string'&&(w.photo||w.image)):[]}catch{return[]}};const shuffle=items=>items.slice().sort(()=>Math.random()-.5);const updateTheme=()=>{const dark=document.documentElement.dataset.theme==='dark';$('themeToggle').setAttribute('aria-label',dark?lang().light:lang().dark);$('themeToggle').title=dark?lang().light:lang().dark;$('themeToggle').querySelector('.theme-icon').textContent=dark?'☼':'◐'};let deck=[],currentWord=null,locked=false,nextTimer=0;const setText=()=>{$('backLabel').textContent=lang().back;$('eyebrow').textContent=lang().eyebrow;$('heading').textContent=lang().heading;$('prompt').textContent=lang().prompt;$('answerInput').placeholder=lang().input;$('checkButton').textContent=lang().check;$('pageTitle').textContent=lang().title;document.title=lang().title+' — '+siteName();document.documentElement.lang=lang().code;updateTheme()};const renderEmpty=()=>{$('flashArea').innerHTML='<div class="flash-empty">'+lang().empty+'</div>';$('inputRow').style.display='none';$('feedback').textContent='';};const nextCard=()=>{clearTimeout(nextTimer);const photos=loadWords();if(!photos.length){currentWord=null;renderEmpty();return}if(!deck.length)deck=shuffle(photos);currentWord=deck.pop();locked=false;$('inputRow').style.display='flex';$('answerInput').value='';$('answerInput').disabled=false;$('checkButton').disabled=false;$('feedback').textContent='';$('feedback').className='flash-feedback';const card=document.createElement('div');card.className='flash-card';card.id='flashCard';const inner=document.createElement('div');inner.className='flash-card-inner';const front=document.createElement('div');front.className='flash-face flash-front';const img=document.createElement('img');img.src=currentWord.photo||currentWord.image;img.alt='';front.append(img);const back=document.createElement('div');back.className='flash-face flash-back';const answer=document.createElement('div');answer.className='flash-answer';answer.textContent=currentWord.word;back.append(answer);inner.append(front,back);card.append(inner);$('flashArea').replaceChildren(card);};const check=()=>{if(locked||!currentWord)return;const correct=normalize($('answerInput').value)===normalize(currentWord.word);if(!correct){playIncorrectSound();$('feedback').textContent=lang().incorrect;$('feedback').className='flash-feedback incorrect';$('answerInput').select();return}locked=true;playCorrectSound();$('feedback').textContent=lang().correct;$('feedback').className='flash-feedback correct';$('answerInput').disabled=true;$('checkButton').disabled=true;$('flashCard').classList.add('flipped');nextTimer=setTimeout(nextCard,2200)};$('checkButton').onclick=check;$('answerInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check()}};const apply=()=>{setText();const words=loadWords();if(!words.length||!currentWord)nextCard();else{$('answerInput').placeholder=lang().input;$('checkButton').textContent=lang().check}};document.querySelectorAll('.language-button').forEach(button=>button.onclick=()=>{localStorage.setItem(LANG_KEY,button.dataset.lang);$('languageMenu').classList.remove('open');deck=[];currentWord=null;apply()});$('languageMenuToggle').onclick=e=>{e.stopPropagation();$('languageMenu').classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.language-menu-wrap'))$('languageMenu').classList.remove('open')});const saved=localStorage.getItem(THEME_KEY);if(saved==='dark'||(!saved&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';$('themeToggle').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem(THEME_KEY,dark?'light':'dark');updateTheme()};apply()})()
</script>
<script>(()=>{const applySiteBackground=()=>{const key=document.documentElement.dataset.theme==='dark'?'vocabulo_background_dark':'vocabulo_background_light',image=localStorage.getItem(key)||'';document.body.style.backgroundImage=image?'url("'+image.replace(/"/g,'\\"')+'")':'';document.body.style.backgroundSize=image?'cover':'';document.body.style.backgroundPosition=image?'center':'';document.body.style.backgroundAttachment=image?'fixed':''};applySiteBackground();window.addEventListener('storage',applySiteBackground);document.getElementById('themeToggle')?.addEventListener('click',()=>setTimeout(applySiteBackground,0))})()</script>
